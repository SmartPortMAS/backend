name: liquid-cargo

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: liquid_cargo_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cargo_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  neo4j:
    image: neo4j:5.12
    container_name: liquid_cargo_graph
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    restart: always

  backend:
    build: 
      context: ./backend
    container_name: liquid_cargo_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/cargo_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # OPENAI_API_KEY: your_api_key
    volumes:
      - ./backend:/app
      - ./onsan_mvp:/onsan_mvp   # 선석별 기상/배정/안전게이트가 참조하는 시드 데이터·스크립트
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: liquid_cargo_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  pgdata:
  neo4j_data:
